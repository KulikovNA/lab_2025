controller_manager:
  ros__parameters:
    update_rate: 100  # Частота обновления, пример

joint_velocity_controller:
  ros__parameters:
    type: velocity_controllers/JointVelocityController  # Тип контроллера
    joint: camera_joint  # Сустав, который контролируется
    gains:
      camera_joint:
        p: 10.0
        i: 0.01
        d: 1.0
